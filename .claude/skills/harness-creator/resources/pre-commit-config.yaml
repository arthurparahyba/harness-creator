# .pre-commit-config.yaml — enforcement portatil da DoD do AGENTS.md.
# Versionado: instalavel em qualquer clone via `pre-commit install`.
#
# Aqui rodam so os sensores baratos (lint/format/types), em segundos. A suite
# de testes e o build ficam na Definition of Done (AGENTS.md) e no CI: pendurar
# minutos de teste em cada commit e o que faz o time aprender `--no-verify`, e
# o bypass aprendido leva junto os sensores baratos.
#
# Para bypass: git commit --no-verify (nao recomendado em commits de grupo).
repos:
  - repo: local
    hooks:
<pre-commit-hooks>
